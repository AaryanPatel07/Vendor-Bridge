<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VendorBridge ERP Design</title>
    <meta
      name="description"
      content="Streamline procurement and vendor management with an intuitive ERP solution designed for businesses to enhance efficiency and collaboration."
    />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Ensure React Refresh globals exist to avoid plugin preamble detection errors
      // (This is a minimal safe fallback for dev; it prevents a runtime throw.)
      if (typeof window !== "undefined") {
        if (!window.$RefreshReg$) window.$RefreshReg$ = () => {};
        if (!window.$RefreshSig$) window.$RefreshSig$ = () => (type) => type;
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
